name: Build Windows EXE

on:
  push:
    branches: [software-only]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install PyTorch (CPU, pinned < 2.6)
        run: pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build EXE with PyInstaller
        shell: bash
        working-directory: Code_Program
        run: |
          pyinstaller --onefile \
            --name VirtualAimbot \
            --add-data "../models/model3(y5m)/yolov5m_best.pt;." \
            --collect-all yolov5 \
            --collect-all torch \
            --hidden-import=win32api \
            --hidden-import=win32con \
            --hidden-import=keyboard \
            --hidden-import=pywintypes \
            main.py

      - name: Upload EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: VirtualAimbot
          path: Code_Program/dist/VirtualAimbot.exe
          retention-days: 30
